<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zvaigžņu Medības</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<h1>Zvaigžņu mednieks</h1>
<h2>Kam spēle domāta?</h2>
<p>Spēle ir domāta cilvēkiem, kuriem patīk kosmoss.</p>
<h2>Mērķis</h2>
<p>Savāc piecas zvaigznes.</p>
<h2>Noteikumi</h2>
<ul>
  <li>Spied uz zvaigznes, lai iegūtu punktu.</li>
  <li>Uzvara ir pie pieciem punktiem.</li>
</ul>
<section aria-label="Spēles sākšanas pogas">
  <button type="button" onclick="document.getElementById('atbilde').textContent='Spēle sākta!'">Spied šeit</button>
  <button type="button" onclick="document.getElementById('atbilde').textContent='Spēle sākta!'">Sākt spēli</button>
  <button type="button" onclick="document.getElementById('atbilde').textContent='Spēle sākta!'">Sākt zvaigžņu medības</button>
</section>
<p id="atbilde" aria-live="polite">Izmēģini kādu no pogām.</p>
</body>
</html>
